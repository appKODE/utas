name: Release
on:
  push:
    tags: [ "*release", "*release-linux", "*release-mac", "*release-win" ]

env:
  RELEASE_ARCHIVE_NAME: utas-release
  RELEASE_TITLE: Utas release ${{ github.ref_name }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Run tests
      run: cargo test --verbose

    - name: Run crate file tests
      run: cargo test -p file

  # A tag ending in "-linux"/"-mac"/"-win" builds only that platform; a bare
  # "*release" tag (no platform suffix) builds all three.
  linux-build-release:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ !endsWith(github.ref_name, '-mac') && !endsWith(github.ref_name, '-win') }}
    permissions:
       contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      run: cargo build --release --verbose

    - name: Compress assets
      run: |
        cd target
        tar cfv "$RELEASE_ARCHIVE_NAME"-linux.tar.gz release/utas

    - name: Create/update draft release and upload assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.RELEASE_TITLE }}
        draft: true
        prerelease: false
        files: target/${{ env.RELEASE_ARCHIVE_NAME }}-linux.tar.gz

  mac-build-release:
    runs-on: macos-latest
    needs: tests
    if: ${{ !endsWith(github.ref_name, '-linux') && !endsWith(github.ref_name, '-win') }}
    permissions:
       contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      run: cargo build --release --verbose

    - name: Compress assets
      run: |
        cd target
        zip -r "$RELEASE_ARCHIVE_NAME"-mac-os.zip release/utas

    - name: Create/update draft release and upload assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.RELEASE_TITLE }}
        draft: true
        prerelease: false
        files: target/${{ env.RELEASE_ARCHIVE_NAME }}-mac-os.zip

  windows-build-release:
    runs-on: windows-latest
    needs: tests
    if: ${{ !endsWith(github.ref_name, '-linux') && !endsWith(github.ref_name, '-mac') }}
    permissions:
       contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      run: cargo build --release --verbose

    - name: Compress assets
      run: |
        cd target
        powershell Compress-Archive -LiteralPath 'release/utas.exe' -DestinationPath '${{ env.RELEASE_ARCHIVE_NAME }}-windows.zip'

    - name: Create/update draft release and upload assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.RELEASE_TITLE }}
        draft: true
        prerelease: false
        files: target/${{ env.RELEASE_ARCHIVE_NAME }}-windows.zip

  # Runs after every platform job that was actually triggered by this tag
  # has finished, and only then flips the shared draft release to published
  # so it never shows up half-built in the "Latest release" sidebar.
  publish-release:
    runs-on: ubuntu-latest
    needs: [ linux-build-release, mac-build-release, windows-build-release ]
    if: |
      always() &&
      (needs.linux-build-release.result == 'success' || needs.linux-build-release.result == 'skipped') &&
      (needs.mac-build-release.result == 'success' || needs.mac-build-release.result == 'skipped') &&
      (needs.windows-build-release.result == 'success' || needs.windows-build-release.result == 'skipped')
    permissions:
      contents: write
    steps:
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"

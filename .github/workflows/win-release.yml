name: Windows Release
on:
  push:
    tags: [ "*release", "*release-win" ]

env:
  RELEASE_ARCHIVE_NAME: utas-release

jobs:
  tests:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Run tests
      run: cargo test --verbose

    - name: Run crate file tests
      run: cargo test -p file

  windows-build-release:
    runs-on: windows-latest
    needs:  tests
    permissions:
       contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      run: cargo build --release --verbose

    - name: Compress assets
      run: |
        cd target
        powershell Compress-Archive -LiteralPath 'release/utas.exe' -DestinationPath '${{ env.RELEASE_ARCHIVE_NAME }}-windows.zip'

    - name: Create release and upload assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Utas-Windows release ${{ github.ref_name }}
        draft: true
        prerelease: false
        files: target/${{ env.RELEASE_ARCHIVE_NAME }}-windows.zip

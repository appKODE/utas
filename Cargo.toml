[package]
name = "utas"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "utas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
anyhow = { version = "1.0.104" }
configparser = { version = "3.2.0", features = ["indexmap"] }
queues = { version = "1.1.0" }
indexmap = { version = "2.14.0" }
file = { path = "crates/file", version = "0.1.0" }
regex = "1.13.1"
lazy_static = "1.5.0"
const_format = "0.2.36"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = { version = "2.2.2" }
predicates = { version = "3.1.4" }
assert_fs = { version = "1.1.4" }
file = { path = "crates/file" }
